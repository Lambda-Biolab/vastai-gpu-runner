# Link Checker — uses the reusable workflow from the org's shared config.
name: Link Checker

on:
  push:
    branches-ignore: [main]
  pull_request:
    types: [closed]
    branches: [main]
  schedule:
    - cron: "00 00 * * 0"
  workflow_dispatch:

jobs:
  check-links:
    uses: Lambda-Biolab/.github-private/.github/workflows/links.yml@v1
