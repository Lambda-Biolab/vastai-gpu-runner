name: CI

"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 11 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# Standard Python project CI bundle, vastai-gpu-runner flavor.
# Mirrors templates/python-repo/.github/workflows/ci.yml with
# vastai-gpu-runner-specific bits:
# - python-versions matrix: ['3.11', '3.12']
# - complexity-threshold: 10 (stricter than the standard 15)
# - extra-test-args: -q --cov --cov-branch --cov-report=term-missing
#   (coverage is local-machine only, not uploaded)
# - real-Vast.ai + real-R2 stress test lives in
#   .github/workflows/stress-real.yml (separate workflow, opt-in
#   via workflow_dispatch or 'stress:run' PR label — costs real
#   money so it must NEVER run automatically).
# - concurrency: cancel-in-progress for the same ref
# - skip codeql on PR (merge-ref SHA race)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - name: actionlint (GitHub Actions workflow linter)
        # Lints .github/workflows/*.yml for syntax errors, context-availability
        # bugs (hashFiles() in job-level if:), unknown runner labels, etc.
        # Runs BEFORE the slow Python install steps so a bad workflow blocks fast.
        shell: bash
        run: |
          bash scripts/install-actionlint.sh
          actionlint -color

      - name: Install uv
        uses: astral-sh/setup-uv@f45168497b927d08c229345a5ab9ad5c85418d0b # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        # `--all-extras` is required so pyright can resolve the
        # `google.cloud.batch_v1` / `google.cloud.storage` symbols
        # imported by src/vastai_gpu_runner/managed_jobs/gcp_batch.py
        # and src/vastai_gpu_runner/storage/gcs.py. Without the `gcp`
        # extra installed, the lint-type-test step fails with
        # `"batch_v1" is unknown import symbol`. Pre-existing CI gap
        # surfaced during the v0.6.0 lockfile sync PR.
        # `--group dev` replaces the legacy `--dev` flag (this project
        # uses [dependency-groups] per PEP 735, not the deprecated
        # [project.optional-dependencies] dev extra).
        run: uv sync --frozen --all-extras --group dev
      - name: Format check
        run: uv run ruff format --check src/ tests/
      - name: Lint
        run: uv run ruff check src/ tests/
      - name: Type check
        # Tests are first-class code.
        run: uv run pyright src/ tests/
      - name: Complexity gate
        # vastai-gpu-runner uses a stricter 10 (vs standard 15).
        run: uv run complexipy src/ --max-complexity-allowed 10
      - name: Test with coverage
        # Coverage is local-machine only (term-missing), not uploaded.
        run: uv run pytest -q --cov --cov-branch --cov-report=term-missing
