name: CI Main
# re-resolve on 2026-08-05

"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 11 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# Standard Python project CI bundle, vastai-gpu-runner flavor.
# Mirrors templates/python-repo/.github/workflows/ci.yml.
# - codeql, links use the opencode-config reusable workflows
# - mutation testing is local-only (pre-push `make mutate-changed`)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@7e7e21ddc30bd66316c7b9889405f485b5022c96 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen --dev
      - run: uv run ruff format --check src/ tests/
      - run: uv run ruff check src/ tests/
      - run: uv run pyright src/ tests/
      - run: uv run complexipy src/ --max-complexity-allowed 10
      - run: uv run pytest -q --cov --cov-branch --cov-report=term-missing

  codeql:
    name: CodeQL
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: python
          build-mode: none

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          output: sarif-results

      - name: Dismiss alerts with inline suppression comments
        if: always()
        uses: advanced-security/dismiss-alerts@a18f986bdb40edba0dd7a74382c15d4a3d50a1c8 # v2.0.3
        with:
          sarif-id: ${{ steps.analyze.outputs.sarif-id }}
          sarif-file: sarif-results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    name: Generate SBOM
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: qte77/gha-sbom-action@cd873b1278a6793a99cfe199c01d603d72cca717 # v0.1.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  links:
    uses: Lambda-Biolab/opencode-config/.github/workflows/links.yml@v1