name: CI

"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 11 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# Standard Python project CI bundle, vastai-gpu-runner flavor.
# Mirrors templates/python-repo/.github/workflows/ci.yml with
# vastai-gpu-runner-specific bits:
# - python-versions matrix: ['3.11', '3.12']
# - complexity-threshold: 10 (stricter than the standard 15)
# - extra-test-args: -q --cov --cov-branch --cov-report=term-missing
#   (coverage is local-machine only, not uploaded)
# - real-Vast.ai + real-R2 stress test lives in
#   .github/workflows/stress-real.yml (separate workflow, opt-in
#   via workflow_dispatch or 'stress:run' PR label — costs real
#   money so it must NEVER run automatically).
# - concurrency: cancel-in-progress for the same ref
# - skip codeql on PR (merge-ref SHA race)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@7e7e21ddc30bd66316c7b9889405f485b5022c96 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: uv sync --frozen --dev
      - name: Format check
        run: uv run ruff format --check src/ tests/
      - name: Lint
        run: uv run ruff check src/ tests/
      - name: Type check
        # Tests are first-class code.
        run: uv run pyright src/ tests/
      - name: Complexity gate
        # vastai-gpu-runner uses a stricter 10 (vs standard 15).
        run: uv run complexipy src/ --max-complexity-allowed 10
      - name: Test with coverage
        # Coverage is local-machine only (term-missing), not uploaded.
        run: uv run pytest -q --cov --cov-branch --cov-report=term-missing

  codeql:
    name: CodeQL
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: python
          build-mode: none
      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          output: sarif-results

  mutation:
    name: Weekly Mutation Testing
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: astral-sh/setup-uv@7e7e21ddc30bd66316c7b9889405f485b5022c96 # v9.0.0
      - run: uv python install 3.12
      - run: uv sync --frozen --dev
      - run: uv pip install mutmut
      - run: uv run mutmut run --max-children=4

  sbom:
    name: Generate SBOM
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: qte77/gha-sbom-action@cd873b1278a6793a99cfe199c01d603d72cca717 # v0.1.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  links:
    name: Link Checker
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--config .lychee.toml ."
          fail: true

