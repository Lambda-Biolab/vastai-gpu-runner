name: "CodeQL"

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 11 * * 0"
  workflow_dispatch:

# This file is also called by the inline `codeql` job in
# .github/workflows/ci.yml when the workflow's pull_request trigger
# fires. CodeQL MUST run on every PR so security findings block the
# merge instead of showing up post-merge. Mirroring the org rule
# documented in
# antomicblitz/opencode-config/templates/python-repo/.github/workflows/ci.yml.

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: github/codeql-action/init@1cd4d01d58f636bbdbffbfd3c121b3446d07e9f3 # v4
        with:
          # `build-mode: none` is the canonical mode for interpreted
          # languages (Python, Ruby, JavaScript/TypeScript) —
          # CodeQL parses the source files directly and builds the
          # call graph without executing or compiling anything.
          # See https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/customizing-code-scanning
          # § "Specifying directories to scan".
          #
          # We explicitly opt out of the `autobuild` heuristic for
          # two reasons documented in biolab-runners' CodeQL
          # workflow:
          #
          #   1. VERSION-PINNED CLI BIAS — the GitHub-hosted
          #      runner's pre-installed CodeQL CLI is the
          #      4.36.2 CLI that refused to honour a newer
          #      manifest ("Loaded a configuration file for
          #      version '4.37.1', but running version '4.36.2'").
          #
          #   2. AUTO-DETECT FAILURE — on uv-managed Python
          #      projects, the autobuild heuristics didn't
          #      recognise `uv.lock` + `pyproject.toml` and emitted
          #      "We were unable to automatically build your code.
          #      Please replace the call to the autobuild action
          #      with your custom build steps."
          #
          # Per the docs (same page, § "Specifying directories to
          # scan"), the recommended config for interpreted languages
          # is `build-mode: none`. CodeQL scans the source tree
          # directly — pure-Python project, no native build step.
          languages: python
          build-mode: none

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@1cd4d01d58f636bbdbffbfd3c121b3446d07e9f3 # v4
        with:
          output: sarif-results

      - uses: advanced-security/dismiss-alerts@53ab66d01eabb3b66427375ce77ba78180b6c008 # v2.0.3
        with:
          sarif-id: ${{ steps.analyze.outputs.sarif-id }}
          sarif-file: sarif-results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
