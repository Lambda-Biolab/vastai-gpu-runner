name: secrets

"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a secrets scan — they are fast and we want them to
# finish on every commit/PR for full audit history.
concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gitleaks:
    name: gitleaks (history + working tree)
    runs-on: ubuntu-latest
    # Gitleaks v3.0.0 makes its own API calls (e.g. listing PR commits
    # for the PR-specific scan). The workflow-level `contents: read`
    # is too restrictive — add `pull-requests: read` so the action
    # can fetch PR data on Dependabot and human PRs alike. Without
    # this, the action errors with "Resource not accessible by
    # integration" (HTTP 403) when trying to call
    # /repos/.../pulls/{n}/commits. The license check (gitleaks.io
    # API) is a separate call and uses GITLEAKS_LICENSE directly.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0
        with:
          # We scan the full git history so a leaked credential
          # committed and then removed in a later commit is still
          # caught. fetch-depth=0 disables shallow clones.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        with:
          config-path: .github/gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      # The gitleaks-action exits 1 on leaks and posts them as PR
      # review comments automatically. No additional step needed.

  bandit:
    name: bandit (Python SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0

      - name: Set up uv
        uses: astral-sh/setup-uv@7e7e21ddc30bd66316c7b9889405f485b5022c96 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --dev

      # Bandit: Python security linter. -ll = low/medium/high only.
      # -ii skips assert_used and hardcoded_password_xml_exact
      # (the latter is redundant with gitleaks). Fail on high+medium
      # findings.
      - name: Run bandit on src/
        run: |
          uv run bandit -r src/ -ll -ii
