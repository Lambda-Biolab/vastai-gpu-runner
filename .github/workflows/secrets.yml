name: secrets

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a secrets scan — they are fast and we want them to
# finish on every commit/PR for full audit history.
concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gitleaks:
    name: gitleaks (history + working tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          # We scan the full git history so a leaked credential
          # committed and then removed in a later commit is still
          # caught. fetch-depth=0 disables shallow clones.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2.6.1
        env:
          # Add the custom config from this repo. The default rules
          # (AWS, Stripe, OpenAI, etc.) are still active because the
          # config uses [extend] useDefault = true.
          GITLEAKS_CONFIG: .github/gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The gitleaks-action exits 1 on leaks and posts them as PR
      # review comments automatically. No additional step needed.

  bandit:
    name: bandit (Python SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@d269b9917d8e33f7165632f15cc38a13726f64b5 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --dev

      # Bandit: Python security linter. -ll = low/medium/high only.
      # -ii skips assert_used and hardcoded_password_xml_exact
      # (the latter is redundant with gitleaks). Fail on high+medium
      # findings.
      - name: Run bandit on src/
        run: |
          uv run bandit -r src/ -ll -ii
