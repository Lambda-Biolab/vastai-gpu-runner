name: secrets

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a secrets scan — they are fast and we want them to
# finish on every commit/PR for full audit history.
concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gitleaks:
    name: gitleaks (history + working tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0
        with:
          # We scan the full git history so a leaked credential
          # committed and then removed in a later commit is still
          # caught. fetch-depth=0 disables shallow clones.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # Add the custom config from this repo. The default rules
          # (AWS, Stripe, OpenAI, etc.) are still active because the
          # config uses [extend] useDefault = true.
          GITLEAKS_CONFIG: .github/gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action v2.0+ requires a license for organization
          # accounts (free for OSS at gitleaks.io — sign up via the
          # "Sign Up" form). Until the org-level GITLEAKS_LICENSE
          # secret is set, the action exits 1 with "missing gitleaks
          # license" before any scanning runs. Two options to resolve:
          #
          #   1. Get a free OSS license at https://gitleaks.io and
          #      set it as the org-level secret GITLEAKS_LICENSE.
          #   2. Fall back to gitleaks-action v1.6.0 (the last
          #      pre-license version) by changing the SHA above to
          #      518e4898c0cd1cc5d9aab6627a2eabd46e81d8da.
          #
          # Until one of those is in place, this secret will be
          # undefined and the action will refuse to run.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      # The gitleaks-action exits 1 on leaks and posts them as PR
      # review comments automatically. No additional step needed.

  bandit:
    name: bandit (Python SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d269b9917d8e33f7165632f15cc38a13726f64b5 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --dev

      # Bandit: Python security linter. -ll = low/medium/high only.
      # -ii skips assert_used and hardcoded_password_xml_exact
      # (the latter is redundant with gitleaks). Fail on high+medium
      # findings.
      - name: Run bandit on src/
        run: |
          uv run bandit -r src/ -ll -ii
