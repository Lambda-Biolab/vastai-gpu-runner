name: secrets

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a secrets scan — they are fast and we want them to
# finish on every commit/PR for full audit history.
concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gitleaks:
    name: gitleaks (history + working tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0
        with:
          # We scan the full git history so a leaked credential
          # committed and then removed in a later commit is still
          # caught. fetch-depth=0 disables shallow clones.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@518e4898c0cd1cc5d9aab6627a2eabd46e81d8da # v1.6.0
        with:
          # v1.6.0 takes the config as an `args` input. The default
          # gitleaks rules are still active (the repo's gitleaks.toml
          # uses [extend] useDefault = true).
          config-path: .github/gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pinned to v1.6.0 (last MIT-licensed version). The
          # gitleaks-action v2.0+ requires a GITLEAKS_LICENSE for
          # organization accounts. Until the org acquires a license
          # from https://gitleaks.io (free for OSS), the v1.x line
          # continues to do the same secret scanning without the
          # reporting/UI features. Upgrade to v3.0.0
          # (e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e) and add the
          # GITLEAKS_LICENSE env when ready.

      # The gitleaks-action exits 1 on leaks and posts them as PR
      # review comments automatically. No additional step needed.

  bandit:
    name: bandit (Python SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d269b9917d8e33f7165632f15cc38a13726f64b5 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --dev

      # Bandit: Python security linter. -ll = low/medium/high only.
      # -ii skips assert_used and hardcoded_password_xml_exact
      # (the latter is redundant with gitleaks). Fail on high+medium
      # findings.
      - name: Run bandit on src/
        run: |
          uv run bandit -r src/ -ll -ii
