---
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      python-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github_actions"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Note on pre-commit-hooks and conventional-pre-commit rev pins
  # in .pre-commit-config.yaml: Dependabot does not have a native
  # `pre-commit` package-ecosystem. Bump them manually with
  #   uv run pre-commit autoupdate
  # and verify the new hooks pass before merging.

# Dependabot-triggered workflows read Dependabot secrets, not Actions secrets.
# Configure GITLEAKS_LICENSE under Settings > Secrets and variables > Dependabot.
# The Dependabot v2 schema cannot grant workflow secrets from this file.
