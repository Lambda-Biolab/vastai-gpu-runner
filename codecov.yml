# Codecov project configuration for vastai-gpu-runner.
# Reference: https://docs.codecov.com/docs/codecov-yaml
#
# This file is picked up automatically by the codecov-action in CI
# once the project is activated at https://codecov.io/gh/Lambda-Biolab/vastai-gpu-runner.

codecov:
  require_ci_to_pass: true
  notify:
    # After CI passes, wait for Codecov's analysis before gating the
    # PR check. Set to 30s to keep PR feedback snappy while still
    # letting Codecov finish its analysis pass.
    after_ci_delay: 30
  # Disable the legacy `status` block — the new GitHub Status Checks
  # API is what Codecov uses for the PR badge. We rely on the
  # `target` + `threshold` in the `coverage.status` block below.
  status:
    project: false
    patch: false

coverage:
  precision: 2
  round: down
  range: "70...90"

  status:
    project:
      default:
        # Aim for 80% coverage, allowing a 1% slack before failing
        # the PR check (so a 79.0% PR doesn't fail, but 78.0% does).
        target: 80%
        threshold: 1%
        if_ci_failed: error
        only_pulls: false
    patch:
      default:
        # New code (lines added/changed in the PR) must be 80%+
        # covered. Catches regressions where the new code path is
        # untested.
        target: 80%
        threshold: 1%

# Carry the coverage XML from the test step. The codecov-action
# `with.files: ./coverage.xml` line in ci.yml is the canonical
# upload path; this block keeps the coverage scope explicit.
flag_management:
  default_rules:
    carryforward: true
    statuses:
      - type: project
        target: 80%
        threshold: 1%
      - type: patch
        target: 80%
        threshold: 1%

# Per-flag configuration. We only have one flag today
# (unittests) but the structure is in place for future flags
# (e.g. integration, stress).
flags:
  unittests:
    paths:
      - src/vastai_gpu_runner/
    carryforward: true

# Comment out the comment markers Codecov looks for; we keep
# annotations inline in the README + module docstrings rather
# than in source files. Disable the auto-generated coverage
# annotations.
comment:
  layout: "header, diff, flags, components, files, footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

# GitHub Checks integration — the Codecov check appears in the
# GitHub PR checks panel.
github_checks:
  annotations: true